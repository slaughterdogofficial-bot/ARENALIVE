async function hp(pw,salt){var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return b64(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:150000},k,256))}

async function authGo(){var g=function(i){return $(i)?$(i).value:""},E=function(m){$("ae").textContent=m};
 if(!window.crypto||!crypto.subtle){E("Нужно защищённое соединение (HTTPS)");return}

 var lg=g("al").trim(),pw=g("ap");
 if(amode=="in"){if(!lg||!pw){E("Введите логин и пароль");return}
  var low=lg.toLowerCase(),cl=low.replace(/[^\d+]/g,""),key=null;

 if(!/^[A-Za-z0-9_]{3,20}$/.test(lg)){E("Логин: 3–20 символов, латиница, цифры и _");return}
 var em=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ct),ph=/^\+?[\d\s()-]+$/.test(ct)&&dg.length>=10&&dg.length<=15;
 if(!em&&!ph){E("Укажите корректный e-mail или номер телефона");return}
 if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw)){E("Пароль: от 8 символов, буквы и цифры");return}
 if(pw!==p2){E("Пароли не совпадают");return}
 if(!$("ak").checked){E("Подтвердите возраст и условия");return}

 var salt=crypto.getRandomValues(new Uint8Array(16));
 d.users[k]={login:lg,contact:ct,salt:b64(salt),hash:await hp(pw,salt),created:Date.now(),data:null};
